# Base experiment config. Every value that changes a result lives here (PLAN.md).
# Child configs set `inherit: base.yaml` and override only what differs.

run:
  name: dev                 # run folder = runs/<YYMMDD>_<name>
  out_root: runs
  split: dev                # dev = original train + valid frames, test = original test frames
  max_frames: null          # null = every frame of the split; smoke takes this many, evenly spaced
  systems: [vlm, jev, gate, gate_conf, gate_either]   # configs/dino.yaml adds threshold (①)
  cache_root: runs/_cache   # detector outputs shared across runs (keyed by detector + data config)

data:
  root: data/brackish-dataset
  images_dir: images
  aau_csvs:
    - annotations/annotations_AAU/train.csv
    - annotations/annotations_AAU/valid.csv
    - annotations/annotations_AAU/test.csv
  frame_wh: [960, 540]

# Original Brackish split lists (frame-level random split; every video appears in both). PLAN.md §2.3.
splits:
  dev: [train.txt, valid.txt]
  test: [test.txt]

# Where candidate boxes come from: gt (AAU boxes; 6-way, no background, no ①) | dino (configs/dino.yaml)
candidates:
  source: gt

# Judgment classes. The first six are the AAU tags; background = no animal in the box.
# The same descriptions go to the VLM (options A-G) and to Jev (choice criteria).
classes:
  fish: "a large fish swimming in open water"
  small_fish: "a small fish, often one of a school"
  crab: "a crab, usually on or near the seabed"
  shrimp: "a shrimp, small and slender, often near the bottom"
  jellyfish: "a jellyfish, translucent and drifting"
  starfish: "a starfish lying on the seabed"
  background: "no animal: turbidity, floating particles, bubbles, seabed texture, or the camera frame"

detector:
  model: IDEA-Research/grounding-dino-base
  prompt: "fish . small fish . crab . shrimp . jellyfish . starfish ."
  phrase_to_class: {fish: fish, small fish: small_fish, crab: crab, shrimp: shrimp,
                    jellyfish: jellyfish, starfish: starfish}
  box_threshold: 0.25       # dev smoke: 0.15 -> 0.25 keeps 19/20 animal boxes and drops ~75% of background ones
  text_threshold: 0.25
  nms_iou: 0.5
  max_candidates_per_frame: 30
  max_box_area_frac: 0.5     # drop near-full-frame boxes (whole-scene detections)
  batch_size: 16
  device: cuda:0

label:
  match_iou: 0.5             # max IoU with GT >= match_iou -> y = matched GT class
  background_iou: 0.3        # max IoU with GT <  background_iou -> y = background; in between -> ambiguous

evidence:
  history_frames: 5          # causal window: the previous K frame numbers of the same video
  match_iou: 0.3             # IoU to link a box to a previous-frame candidate

prompts:
  context: >-
    Fixed underwater camera in turbid brackish water (960x540 video). Each candidate box marks one
    animal that a person annotated; decide which animal it is. Animals are often faint, blurry or
    cut off at the frame border: fish and small fish in the water column, crabs, shrimp and starfish
    on or near the seabed, jellyfish drifting.
  question: "What is inside this candidate box?"
  need_vlm_question: >-
    How much would looking at the image itself be needed to be sure of the class of this candidate
    box, given only the evidence in the state?
  need_vlm_levels:
    - "1: the evidence alone is decisive; no image check needed"
    - "2: fairly sure from the evidence; an image check is unlikely to change the answer"
    - "3: unsure; an image check could change the answer"
    - "4: probably needs an image check"
    - "5: cannot decide without looking at the image"

jev:
  model: jev-latest
  endpoint: https://api.typesafe.ai/v1/systemone
  api_key_env: TYPESAFE_API_KEY
  batching: per_frame        # per_frame: one request per frame, two questions per box | per_box
  timeout_s: 60
  max_retries: 4
  max_concurrency: 16

vlm:
  model: Qwen/Qwen3-VL-8B-Instruct
  dtype: bfloat16
  device: cuda:0
  batch_size: 32
  crop_context: 1.0          # crop = box expanded by this fraction of its size on each side
  crop_long_side: 336        # crop is resized so its longer side has this many pixels
  show_detector_hint: true   # tell the VLM the detector's proposed class and score (Jev sees them too)
  box_color: [255, 0, 0]
  box_width: 3

gate:
  primary: gate              # pre-registered primary gate: route when Jev need_vlm level >= tau_e
  max_auto_error: 0.05       # every tau is the setting with the most auto-handled boxes whose dev error <= this
  need_vlm_grid_step: 0.05   # tau_e grid over the 1-5 need_vlm level
  conf_grid_step: 0.01       # tau_c grid over Jev top-class probability

thresholds_file: null        # test runs must point to a dev-fitted thresholds.yaml

metrics:
  ece_bins: 15
  min_class_n: 20            # class panels with fewer scored boxes are greyed out
  bootstrap:
    n: 1000
    block_frames: 10         # consecutive frames per resampling block (frames are not independent)
    seed: 0
  regression_tol: 0.01

# Pre-registered endpoints (PLAN.md §5). Evaluated in order; stop at the first failure.
endpoints:
  sequential:
    - {name: primary, min_delta_acc_ci_low: -0.02, max_vlm_call_ratio: 0.5}
    - {name: stricter_acc, min_delta_acc_ci_low: -0.01, max_vlm_call_ratio: 0.5}
    - {name: stricter_calls, min_delta_acc_ci_low: -0.01, max_vlm_call_ratio: 0.3}

plots:
  appendix: false            # true -> figures/appendix/ with per-system ROC, 2x2 grids, confusion matrices

viz:
  sample_frames: 12          # random frames rendered under viz/<view>/ and viz/compare/
  seed: 0

budget:
  max_jev_requests: 16000
  max_jev_tokens: 60000000
  max_vlm_calls: 120000

cost:
  jev_usd_per_1m_tokens: null  # unknown; fill from the TypeSafe console
