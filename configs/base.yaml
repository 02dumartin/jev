# Base config (PLAN.md v6). Every value that changes a result lives here.
# Child configs set `inherit: base.yaml` and override only what differs.

run:
  name: dev                 # run folder = runs/<YYMMDD>_<name>
  out_root: runs
  split: dev                # dev = val videos of the video split, test = test videos
  max_videos: null          # smoke: the first N videos of the split
  max_frames_per_video: null
  systems: [yolo, track_vote, vlm_all, jev, gate]

data:
  root: data/brackish-dataset
  images_dir: images
  annotations_dir: annotations/annotations_AAU
  aau_csvs:
    - annotations/annotations_AAU/train.csv
    - annotations/annotations_AAU/valid.csv
    - annotations/annotations_AAU/test.csv
  split_lists: [train.txt, valid.txt, test.txt]   # frames outside these lists have unknown GT
  frame_wh: [960, 540]

# Video-level split (no video in two splits). dev = its "val" videos, test = its "test" videos.
video_split:
  file: configs/splits/video_split.yaml   # committed; created once by scripts/make_video_split.py
  fractions: {train: 0.70, val: 0.15, test: 0.15}
  min_boxes_per_class: 20
  trials: 20000
  seed: 0
  run_split_to_video_split: {dev: val, test: test}

# The six AAU classes. The same descriptions go to the VLM prompt and to Jev's state.
classes:
  fish: "a large fish swimming in open water"
  small_fish: "a small fish, often one of a school"
  crab: "a crab, usually on or near the seabed"
  shrimp: "a shrimp, small and slender, often near the bottom"
  jellyfish: "a jellyfish, translucent and drifting"
  starfish: "a starfish lying on the seabed"
not_an_animal: "no animal: turbidity, floating particles, bubbles, seabed texture, or the camera frame"

# YOLO training (scripts/prepare_yolo.py, train_yolo.py, eval_yolo.py). Variants: configs/yolo*.yaml.
yolo:
  split_source: video               # video: the video split | original: the dataset's frame-level random lists
  original_lists: {train: train.txt, val: valid.txt, test: test.txt}
  dataset_dir: data/yolo_brackish
  model: yolo12s.pt                 # COCO-pretrained
  project: train                    # outputs: train/<name>/
  name: yolo12s_video
  epochs: 100
  imgsz: 640
  batch: 16
  device: 4
  seed: 0
  workers: 8
  patience: 100
  freeze: null
  note: ""

# Detector + tracker that produce the tracks to judge (S1).
track:
  weights: train/yolo12s_video/weights/best.pt
  tracker: bytetrack.yaml           # Ultralytics tracker config
  conf: 0.1                         # detection floor; ByteTrack starts tracks at 0.25 and extends them down to 0.1
  iou: 0.7                          # NMS IoU
  imgsz: 640
  device: 0
  fps: 15                           # Brackish frames were extracted at 15 fps
  out_dir: tracks                   # scripts/track_yolo.py writes train/<yolo.name>/<out_dir>/

label:
  match_iou: 0.5                    # box vs GT max IoU >= this -> y_box = GT class
  background_iou: 0.3               # < this -> background; in between -> ambiguous (not scored)
  track_ok_share: 0.5               # y_track = 1 when >= this share of scored boxes match the majority class

prompts:
  context: >-
    Fixed underwater camera in turbid brackish water (960x540 video at 15 fps). An object detector
    trained on other videos of this camera ran on every frame, and a tracker linked its boxes over
    time into tracks. A track can be a real animal of the detector's class, a real animal of another
    class, or no animal at all (turbidity, particles, bubbles, seabed texture). Animals are often
    faint, blurry or cut off at the frame border: fish and small fish swim in the water column,
    crabs, shrimp and starfish stay on or near the seabed, jellyfish drift.
  question: "Is this track a real {cls}?"          # {cls} = the track's majority class
  true_means: "the boxes show a real {cls}"
  false_means: "the boxes show another animal or no animal"
  class_fix_question: "Which animal does this track show, if any?"

jev:
  model: jev-latest
  endpoint: https://api.typesafe.ai/v1/systemone
  api_key_env: TYPESAFE_API_KEY
  max_tracks_per_request: 20       # tracks of one video share a request; each track adds two questions
  timeout_s: 60
  max_retries: 4
  max_concurrency: 8
  include_detector_reliability: false   # exploratory: add YOLO's per-class dev precision/recall to the state
  detector_reliability_file: train/yolo12s_video/eval.json

vlm:
  model: Qwen/Qwen3-VL-8B-Instruct
  dtype: bfloat16
  device: cuda:0
  batch_size: 16
  crop_context: 1.0                 # crop = box expanded by this fraction of its size on each side
  crop_long_side: 336
  box_color: [255, 0, 0]
  box_width: 3

gate:
  max_auto_error: 0.05              # tau = most Jev-handled tracks whose dev error <= this
  tau_grid_step: 0.01

thresholds_file: null               # test runs point to the dev-fitted thresholds.yaml

metrics:
  ece_bins: 15
  min_class_n: 20                   # class panels with fewer scored boxes are greyed out
  bootstrap: {n: 1000, seed: 0}     # cluster bootstrap over tracks (PLAN.md §6.3)
  regression_tol: 0.01

# Pre-registered endpoints (PLAN.md §6.1). Evaluated in order; stop at the first failure.
endpoints:
  primary_pair: [gate, vlm_all]
  sequential:
    - {name: primary, min_delta_acc_ci_low: -0.02, max_vlm_call_ratio: 0.5}
    - {name: stricter_acc, min_delta_acc_ci_low: -0.01, max_vlm_call_ratio: 0.5}
    - {name: stricter_calls, min_delta_acc_ci_low: -0.01, max_vlm_call_ratio: 0.3}

viz:
  enabled: true
  videos: true
  video_panels: [gt, gate]          # left | right of evaluation/videos/<video>.mp4 (gt or any system)
  sample_frames: 12
  seed: 0

budget:
  max_jev_requests: 2000
  max_jev_tokens: 20000000
  max_vlm_calls: 20000

cost:
  jev_usd_per_1m_tokens: null       # unknown; fill from the TypeSafe console
