# YOLO12 detector trained on a video-level split of Brackish (PLAN.md v5).
inherit: base.yaml

video_split:
  file: splits/video_split.yaml     # committed; created once by scripts/make_video_split.py
  fractions: {train: 0.70, val: 0.15, test: 0.15}
  min_boxes_per_class: 20           # val and test must each hold at least this many boxes of every class
  trials: 20000
  seed: 0

yolo:
  split_source: video               # video: splits/video_split.yaml | original: the dataset's frame-level random lists
  original_lists: {train: train.txt, val: valid.txt, test: test.txt}   # used when split_source = original
  dataset_dir: data/yolo_brackish   # images are symlinks; labels converted from AAU (class 0-5, normalised xywh)
  model: yolo12s.pt                 # COCO-pretrained weights, Ultralytics default training settings below
  project: train                    # training outputs: train/<name>/ (weights, results.csv, plots)
  name: yolo12s_video
  epochs: 100
  imgsz: 640
  batch: 16
  device: 4
  seed: 0
  workers: 8
  patience: 100                     # Ultralytics default (no early stop within 100 epochs)
  freeze: null                      # number of leading layers kept frozen; null = train everything
  note: ""

# Video rendering with multi-object tracking on held-out videos (scripts/track_yolo.py).
track:
  split: test                       # which videos of splits/video_split.yaml to render
  weights: best.pt                  # train/<yolo.name>/weights/<this>
  tracker: bytetrack.yaml           # Ultralytics tracker config (bytetrack.yaml | botsort.yaml)
  conf: 0.25                        # detection confidence floor, same for detect-only and tracked panels
  iou: 0.7                          # NMS IoU
  fps: 15                           # output video frame rate (Brackish frames were extracted at 15 fps)
  out_dir: tracks                   # train/<yolo.name>/<out_dir>/
