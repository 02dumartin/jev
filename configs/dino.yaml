# Candidates from Grounding DINO instead of GT boxes: 7-way (6 animals + background) and the ① detector baseline.
inherit: base.yaml

run:
  name: dino-dev
  systems: [threshold, vlm, jev, gate, gate_conf, gate_either]

candidates:
  source: dino

prompts:
  context: >-
    Fixed underwater camera in turbid brackish water (960x540 video). A zero-shot object detector,
    run with a low score threshold, proposed candidate boxes, so many candidates contain no animal
    (turbidity, particles, bubbles, seabed texture, camera frame). Real animals are often faint,
    blurry or cut off at the frame border: fish and small fish in the water column, crabs, shrimp
    and starfish on or near the seabed, jellyfish drifting. Each candidate shows the detector's
    proposed class and score; the detector's class can be wrong.
