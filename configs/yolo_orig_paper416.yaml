# Pedersen et al. 2019 (CVPRW) setting as far as it maps to YOLO12: original split, 416x416 input,
# earliest layers frozen (here: the 9-layer YOLO12 backbone). Their 30,000 Darknet iterations cannot be
# converted to epochs without their batch size, so the epoch budget stays at 100.
inherit: yolo_orig.yaml

yolo:
  imgsz: 416
  freeze: 9
  name: yolo12s_orig_paper416
  device: 5
  note: "Pedersen et al. 2019 setting: original split, 416 input, backbone frozen."
