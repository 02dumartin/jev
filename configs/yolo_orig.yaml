# Same training as yolo.yaml, but on the dataset's own frame-level random split (Pedersen et al. 2019;
# also the Roboflow version used by Informatica 2025). Isolates the effect of the split.
inherit: yolo.yaml

yolo:
  split_source: original
  dataset_dir: data/yolo_brackish_orig
  name: yolo12s_orig
  device: 0
  note: "Original frame-level random split (train.txt / valid.txt / test.txt); otherwise identical to yolo12s_video."
