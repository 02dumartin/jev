run_id: 261015_retail-demo
git:
  commit: 744420e
  branch: feat/retail-demo
  dirty: true
  time: '2026-10-15T05:58:07'
config:
  run:
    name: retail-demo
    out_root: runs
    max_clips: null
  data:
    root: data/retail-demo/retailaction
    clips_dir: clips
    selection: selection.json
    samples: samples.json
    frames: frames.json
    meta: meta.jsonl
    license_files:
    - LICENSE
    - NOTICE.txt
  rotation:
    head_joints:
    - 0
    - 1
    - 2
    hip_joints:
    - 15
    - 16
    - 17
    min_frames: 3
  events:
    enabled: true
    marker_radius_frac: 0.06
    marker_color:
    - 255
    - 210
    - 0
  vlm:
    model: Qwen/Qwen3-VL-8B-Instruct
    dtype: bfloat16
    device: cuda:0
    frames: 8
    frame_px: 448
    max_new_tokens: 320
    prompt: 'These are {n} frames in time order from a ceiling camera in a convenience
      store (faces are blurred, the view is rotated so people stand upright). {events}Describe
      only what is observable, with no advice or judgement. Answer as compact JSON
      with these keys: area (drinks fridge / snack shelf / checkout / entrance / other),
      people_count (int), children_present (true/false), fridge_door_open (true/false/null
      if no fridge), shopper_movement (standing still / slowly browsing / walking
      through), carrying (none / basket / bag / products in hands / child), products_handled
      (list of short phrases: what was picked up or put back, using the known events),
      shelf_condition (tidy / gaps / messy / not visible), floor_obstruction (none
      or short phrase), notes (one sentence about the scene).'
  jev:
    model: jev-latest
    endpoint: https://api.typesafe.ai/v1/systemone
    api_key_env: TYPESAFE_API_KEY
    timeout_s: 60
    max_retries: 4
    max_concurrency: 8
    single_question_compare: true
    confident: 0.75
  questions:
    needs_help:
      type: noul
      title: Shopper needs help?
      instructions: Does a shopper appear to need staff help right now (searching,
        hesitating for long, struggling)?
    product_taken:
      type: noul
      title: Product taken?
      instructions: Did the shopper end up keeping a product (picked up and not put
        back)?
    fridge_open:
      type: noul
      title: Fridge door open?
      instructions: Is a fridge door open, or left open without anyone using it?
    crowding:
      type: score
      title: Crowding
      instructions: How crowded is this area?
      criteria:
      - empty
      - one shopper
      - a few shoppers
      - busy
      - blocked
    shopper_activity:
      type: choice
      title: Shopper activity
      instructions: What is the main shopper doing?
      criteria:
        browsing: null
        picking_products: null
        returning_product: null
        passing_through: null
        no_shopper: null
    staff_action:
      type: choice
      title: Staff action
      instructions: What should a staff member do next?
      criteria:
        none: null
        offer_help: null
        close_fridge: null
        tidy_shelf: null
        restock_check: null
        keep_watching: null
    human_review:
      type: noul
      title: Needs a person to look?
      instructions: Is the situation unclear enough that a person should look at this
        camera?
  actions:
  - badge: CLOSE FRIDGE
    when:
      fridge_open: '>=0.75'
    color: '#3CC8FF'
  - badge: OFFER HELP
    when:
      needs_help: '>=0.75'
    color: '#FF8C1A'
  - badge: MANAGER CHECK
    when:
      human_review: '>=0.5'
    color: '#FFE135'
  - from_choice: staff_action
    badges:
      none:
        badge: NO ACTION
        color: '#4ED36B'
      keep_watching:
        badge: KEEP WATCHING
        color: '#9AD0EC'
      offer_help:
        badge: OFFER HELP
        color: '#FF8C1A'
      close_fridge:
        badge: CLOSE FRIDGE
        color: '#3CC8FF'
      tidy_shelf:
        badge: TIDY SHELF
        color: '#D35BFF'
      restock_check:
        badge: RESTOCK CHECK
        color: '#E8384F'
  render:
    clips_in_video: 24
    seed: 0
    fps: 6
    hold_s: 2.5
    canvas:
    - 1600
    - 900
    title: Store camera  →  VLM observes  →  Jev decides (one request, many questions)  →  code
      acts
    credit: 'Video: RetailAction (Standard AI), Standard.AI Dataset License. Faces
      blurred by the dataset.'
  budget:
    max_jev_requests: 3000
    max_jev_tokens: 5000000
    max_vlm_calls: 1000
